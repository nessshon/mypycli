[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "mypycli"
description = "Python framework for building extensible CLI applications with modules, REPL console, and daemon mode."
requires-python = ">=3.10"
authors = [
    { name = "nessshon" },
]
maintainers = [
    { name = "nessshon" },
]
license = "MIT"
readme = "README.md"
dynamic = ["version"]
keywords = [
    "CLI",
    "console",
    "daemon",
    "framework",
    "modules",
    "REPL",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
    "psutil>=7.0",
    "requests>=2.31.0",
    "pyyaml>=6",
    "rich>=13.0",
    "prompt-toolkit>=3.0",
    "filelock>=3.12",
    "inquirerpy>=0.3",
]

[project.urls]
Homepage = "https://github.com/nessshon/mypycli"

[project.scripts]
mypycli = "mypycli.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "mypy>=1.14",
    "ruff>=0.9",
]

[tool.setuptools.dynamic]
version = { attr = "mypycli.__meta__.__version__" }

[tool.setuptools.packages.find]
include = ["mypycli", "mypycli.*"]

[tool.setuptools.package-data]
mypycli = ["py.typed", "components/translator/locales/*.yml"]


[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
allowed-confusables = ["❯", "×"]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["mypycli"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = true
disable_error_code = ["type-abstract"]

[[tool.mypy.overrides]]
module = "InquirerPy.*"
implicit_reexport = true

[[tool.mypy.overrides]]
module = "mypycli.components.prompt"
warn_return_any = false
